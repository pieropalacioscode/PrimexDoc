version: "2"

services:
  db:
    image: postgres:16-alpine
    container_name: primex_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-docentesmart}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smart2026}
      POSTGRES_DB: ${DB_NAME:-primex}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - primex_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: primex_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - primex_network

networks:
  primex_network:
    driver: bridge

volumes:
  pgdata: